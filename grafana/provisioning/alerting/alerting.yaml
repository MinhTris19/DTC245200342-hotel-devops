apiVersion: 1

contactPoints:
  - orgId: 1
    name: alert-sink-webhook
    receivers:
      - uid: alert_sink_receiver
        type: webhook
        settings:
          url: http://alert-sink:8080/alert

policies:
  - orgId: 1
    receiver: alert-sink-webhook
    group_by: ['alertname']
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 1h
